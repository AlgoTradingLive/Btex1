apply plugin: 'com.android.application'

android {
    namespace "com.btex.app"
    compileSdkVersion 36
    defaultConfig {
        applicationId "com.btex.app"
        minSdkVersion 24
        targetSdkVersion 36
        versionCode 15
        versionName "5.15"
    }
    buildTypes {
        debug {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.4.0'
}
